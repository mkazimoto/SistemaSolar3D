name: Publicar no GitHub Pages

# Publica o site estático (index.html) no GitHub Pages a cada push na main.
#
# Pré-requisito (uma única vez): em Settings → Pages, definir Source = "GitHub Actions".
# O parâmetro enablement do configure-pages exige um token diferente do GITHUB_TOKEN
# (PAT com escopo repo, ou GitHub App com administration:write + pages:write), conforme a
# própria documentação da action. Sem isso o POST /pages responde
# "Resource not accessible by integration" — por isso o ajuste é manual e feito uma vez.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões exigidas pelo fluxo de artefato do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultâneos; o mais recente sempre vence
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar site
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verificar configuração do Pages
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(curl -s -w '\nHTTP%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          code=${out##*HTTP}
          body=${out%HTTP*}
          echo "GET /repos/${{ github.repository }}/pages -> HTTP $code"

          if [ "$code" = "404" ]; then
            echo "::error title=Habilite o GitHub Pages::Abra Settings → Pages e defina Source = 'GitHub Actions'. O GITHUB_TOKEN não pode criar o site do Pages (a action exige PAT ou GitHub App com permissão de administração), então esse passo único é feito pelo dono do repositório."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=Falha ao consultar o Pages::A API respondeu HTTP $code."
            exit 1
          fi

          echo "Resposta da API do Pages: $body"

          # Detecta o tipo de build com jq (disponível nos runners) e, se faltar,
          # com um fallback que normaliza espaços — evita falso negativo em JSON formatado.
          build_type=$(printf '%s' "$body" | jq -r '.build_type // empty' 2>/dev/null || true)
          if [ -z "$build_type" ]; then
            build_type=$(printf '%s' "$body" | tr -d ' \t\r\n' | grep -o '"build_type":"[a-z]*"' | cut -d'"' -f4 || true)
          fi
          echo "build_type detectado: ${build_type:-desconhecido}"

          # Só ignora o deploy quando houver certeza de que a origem é um branch.
          # Em qualquer outro caso tenta publicar: falha explícita é melhor do que
          # um deploy silenciosamente ignorado (site ficaria 404 sem aviso).
          if [ "$build_type" = "legacy" ]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages publicando a partir de um branch::O site é publicado pela origem em branch, então o deploy por artefato foi ignorado. Para passar a usar este workflow, defina Source = 'GitHub Actions' em Settings → Pages."
          else
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
            echo "Pages configurado para GitHub Actions — o deploy por artefato será feito."
          fi

      - name: Montar artefato estático
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html não encontrado"; exit 1; }
          mkdir -p _site
          cp index.html _site/
          echo "Conteúdo publicado:"
          find _site -type f | sort

      - name: Configurar Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/configure-pages@v6

      - name: Enviar artefato
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Publicar no GitHub Pages

# Publica o site estático (index.html) no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Permissões exigidas pelo fluxo de artefato do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultâneos; o mais recente sempre vence
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar artefato estático
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html não encontrado"; exit 1; }
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          echo "Conteúdo publicado:"
          find _site -type f | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages automaticamente (source = GitHub Actions) se ainda não existir
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Verificações

# Valida o arquivo principal e roda os testes de fumaça. Independe do deploy
# (deploy-pages.yml) — assim uma falha aqui não impede a publicação, mas fica visível.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Validar HTML e testar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências de desenvolvimento
        run: npm ci

      - name: Verificar sintaxe do módulo embutido em index.html
        run: npm run check:syntax

      - name: Validar index.html
        run: npm run lint:html

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes de fumaça
        run: npm test

      - name: Guardar relatório de falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
